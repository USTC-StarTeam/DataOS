[project]
name = "dataos_agent"
version = "0.3.0"
description = "Unified interface over code-agent CLIs (claude / kimi / qwen ...)"
requires-python = ">=3.11"  # asyncio.timeout / TimeoutError builtin in the healing layer
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dataos_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: real CLI calls (needs login)"]
testpaths = ["tests"]
pythonpath = ["src"]
