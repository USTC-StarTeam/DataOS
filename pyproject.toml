[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos"
version = "0.2.1"
description = "DataOS Python package skeleton"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
dependencies = [
  "datasets>=2.19.0",
  "httpx>=0.28,<0.29",
  "pyarrow>=15.0.0",
  "dataos-operator @ git+https://github.com/USTC-StarTeam/DataOS-Operator.git@jsonl2HF",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]
train = [
  "llamafactory[metrics]>=0.9.4,<0.10",
]
eval = [
  "lm-eval>=0.4.9",
  "transformers>=4.45,<5.0",
  "accelerate>=0.34",
  "evaluate>=0.4.0",
  "openai>=1.0.0",
  "tenacity",
  "langdetect",
  "immutabledict",
  "nltk",
]
vllm = [
  "vllm>=0.8.0",
  "ray>=2.9",
]

[project.scripts]
dataos = "dataos.cli:main"

[tool.setuptools.packages.find]
include = ["dataos*"]

[tool.ruff]
line-length = 100
target-version = "py311"
