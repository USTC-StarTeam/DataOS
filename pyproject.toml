[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos"
version = "0.3.0a0"
description = "DataOS autonomous SFT runtime (agent-version): deterministic v0.2.5 library + code-driven Agent SDK loop"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
dependencies = [
  # --- deterministic executor library (v0.2.5, unchanged) ---
  "datasets>=2.19.0",
  "httpx>=0.28,<0.29",
  "pyarrow>=15.0.0",
  "dataos-operator @ git+https://github.com/USTC-StarTeam/DataOS-Operator.git@v0.5.0",
  # --- autonomous layer (dataos.agent): main + sub agents drive code-agent CLIs
  #     (claude / kimi / qwen ...) via the dataos-agent package (transport self-healing
  #     lives there); the thin adapter is src/dataos/agent/llm/cli_agent.py ---
  "dataos-agent @ git+https://github.com/USTC-StarTeam/DataOS-Agent.git@84211ee036b28eef9924fab468113bbbe50679f4",
  "pydantic>=2.6",
  "tenacity>=8.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0",
]
train = [
  "llamafactory[metrics]>=0.9.4,<0.10",
]
eval = [
  "lm-eval>=0.4.9",
  "transformers>=4.45,<5.0",
  "accelerate>=0.34",
  "evaluate>=0.4.0",
  "openai>=1.0.0",
  "langdetect",
  "immutabledict",
  "nltk",
]
vllm = [
  "vllm>=0.8.0",
  "ray>=2.9",
]

[project.scripts]
dataos = "dataos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataos*"]

[tool.setuptools.package-data]
dataos = ["agent/compose_templates/*.j2", "prompt/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "resources/code/inspect_evals",
  "resources/code/posttrainbench/tasks",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
