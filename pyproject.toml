[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos"
version = "0.1.0"
description = "DataOS Python package skeleton"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
dependencies = [
  "datasets>=2.19.0",
  "pyarrow>=15.0.0",
  "prompt_toolkit>=3.0.43",
  "pyclean>=3.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["dataos*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: tests that require external API access",
  "task_eval: model-capability task evaluations (non-blocking in CI)",
  "mcp_external: external third-party MCP connectivity tests (manual run)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
