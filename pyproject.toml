[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-agent"
version = "0.1.0"
description = "Minimal Python coding agent (PR1 skeleton)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "ruff>=0.6.0",
]

[project.scripts]
py-agent = "py_agent.main:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "integration: tests that require external API access",
]

[tool.ruff]
line-length = 100
target-version = "py311"
