[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos"
version = "0.3.0a0"
description = "DataOS autonomous SFT runtime (agent-version): deterministic v0.2.5 library + code-driven Agent SDK loop"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
dependencies = [
  # --- deterministic executor library (v0.2.5, unchanged) ---
  "datasets>=2.19.0",
  "httpx>=0.28,<0.29",
  "pyarrow>=15.0.0",
  # --- in-repo workspace members (see src/) ---
  "dataos-operator",
  "dataos-tools",
  # --- autonomous layer (dataos.agent): main + sub agents drive code-agent CLIs
  #     (claude / kimi / qwen ...) via the in-repo dataos_agent package
  #     (src/dataos_agent — transport self-healing lives there) ---
  "pydantic>=2.6",
  "tenacity>=8.0",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[tool.uv.workspace]
# Both members live under src/, beside dataos/ and dataos_agent/, and each directory is named
# for the distribution it holds: `src/dataos-tools` is the agent's three instruments plus the
# launcher they submit through, `src/operator` is dataos-operator. Separate distributions
# because the cluster venvs install them
# WITHOUT the platform.
members = ["src/dataos-tools", "src/operator"]

[tool.uv.sources]
dataos-operator = { workspace = true }
dataos-tools = { workspace = true }

[dependency-groups]
dev = [
  "ruff>=0.6.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pillow>=10.0",   # dataos-operator's image evaluators are tested, so their one dep is a dev dep
]

[project.optional-dependencies]
train = [
  "llamafactory[metrics]>=0.9.4,<0.10",
]
eval = [
  "lm-eval>=0.4.9",
  "transformers>=4.45,<5.0",
  "accelerate>=0.34",
  "evaluate>=0.4.0",
  "openai>=1.0.0",
  "langdetect",
  "immutabledict",
  "nltk",
]
vllm = [
  "vllm>=0.8.0",
  "ray>=2.9",
]

[project.scripts]
dataos = "dataos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataos*"]

[tool.setuptools.package-data]
dataos = ["agent/compose_templates/*.j2", "prompt/**/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  "resources/code/inspect_evals",
  "resources/code/posttrainbench/tasks",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src/dataos-tools/tests", "src/operator/tests"]
# integration tests drive real code-agent CLIs (kimi/codex/...) — run on demand only
addopts = "--ignore=tests/dataos_agent/integration"
asyncio_mode = "auto"
