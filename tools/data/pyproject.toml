[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataos-data"
version = "0.1.0"
description = "The data stage's job wrapper and output contract (submit/status; the recipe stays the agent's)"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
# Deliberately NOT dataos-operator. The operators are the substrate the recipe is written in,
# the way LLaMA-Factory is for dataos-train and lm-eval is for dataos-eval — and neither of
# those depends on the substrate it drives either. They live in the exec host's venv; this
# renders the job that runs there.
dependencies = [
  "dataos-launch",
  "pyyaml>=6.0",
]

[project.scripts]
dataos-data = "dataos_data.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/dataos_data"]
