[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos-train"
version = "0.1.9"
description = "Unified multi-backend training layer for DataOS (LLaMA-Factory, verl; Slurm + bare-metal)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
license = { text = "MIT" }
keywords = ["training", "sft", "rl", "grpo", "llama-factory", "verl", "data-centric"]
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0"]
# Heavy training stacks live in per-backend conda envs on the cluster, not here.
# These extras are for local/dev installs only.
llamafactory = ["llamafactory[metrics]>=0.9.4,<0.10"]
verl = ["ray>=2.9"]
data = ["datasets>=2.19.0"]
all = ["dataos-train[dev,data]"]

[project.scripts]
dataos-train = "dataos_train.cli:main"

# Optional plugin discovery: external packages can register backends/launchers/hooks.
[project.entry-points."dataos_train.backends"]
# example = "my_pkg.my_backend:MyBackend"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dataos_train*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: end-to-end tests that need external systems",
  "needs_slurm: requires a Slurm scheduler",
  "needs_gpu: requires a GPU + heavy training deps",
]
