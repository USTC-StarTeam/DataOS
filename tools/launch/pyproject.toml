[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataos-launch"
version = "0.1.0"
description = "Where a rendered job runs, and how its progress is read back: the JobSpec/Handle contract plus the Slurm and bare-metal launchers."
requires-python = ">=3.11"
authors = [{ name = "USTC-StarTeam" }]
license = { text = "MIT" }
keywords = ["slurm", "launcher", "job", "scheduler"]
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
dev = ["ruff>=0.6.0", "pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
