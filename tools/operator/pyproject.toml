[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dataos-operator"
version = "0.2.0"
description = "A data-centric operator framework skeleton for evaluators, generators, mappers, mixers, clusterers, reweighters, refiners, and selectors."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "DataOS Operator Contributors" }
]
keywords = [
  "data-centric-ai",
  "dataset",
  "operator",
  "llm-evaluation",
  "data-operator"
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
# datasets is now a core dependency: the Dataset container is backed by an
# in-memory Hugging Face datasets.Dataset (Arrow), not a Python list of dicts.
dependencies = [
  "datasets>=2.20"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.6"
]
# Retained for backward compatibility / explicit intent; datasets is core now.
hf = [
  "datasets>=2.20"
]
llm = [
  "torch>=2.1",
  "transformers>=4.44"
]

[tool.hatch.build.targets.wheel]
packages = ["dataos_operator"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["dataos_operator"]

[[tool.mypy.overrides]]
module = "datasets.*"
ignore_missing_imports = true
