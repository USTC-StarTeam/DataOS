# 环境契约:PostTrainBench 在 H100 Slurm 集群(hcgu)的部署(env = (task,机器) 部署单元)
# 字段规范见 DataOS-Runtime/CONTRACT.md §1。命令模板用 jinja2:
#   {{ env.* }} / {{ run.* }} 解析时(compose.resolve)填;{{ ctx.* }} 保留给 sub-agent 执行时填。
# 秘钥本身绝不入库 —— 只记 key 文件路径。

name: PTB_H100_slurm_normal
kind: slurm

access:
  host: 114.214.215.159
  user: hcgu
  port: 22
  key_ref: ~/.ssh/ghc_miyao        # 控制面本地私钥路径(不入库)

slurm:                             # 环境级 Slurm 默认(per-run 的 node/gpus/cpus 走 run.resource)
  partition: gpu
  qos: gpu_normal
  nodes: "gpu01,gpu02,gpu03"         # 我们的节点池:Slurm 在池内自选空闲节点;run.resource.node 可钉更窄

tools:                             # 机器预装的通用运行时(uv venv;基础框架,不含任何 agent 私有方法库)
  # uv venv = 标准 venv(bin/python);一律按 {path}/bin/<tool> 调用,无需 conda/activate。
  # 定义在 envs/*(build.sh + requirements);DataOS 使用的 venv(dataos_sft/train-cli)建在
  # deploy checkout 内(configs/environments/.../envs/*/.venv,git 忽略),rl/eval 基线仍
  # 在旧的 dataos_runtime 位置(暂不迁移)。
  # ★ 冻结:sft/rl/eval 三个 venv 是共享基线,禁止改动;需异构依赖请在 environments/ 下新建环境(见 discipline)。
  # sft_env 指向 dataos_sft:sft 基线的 DataOS 派生版,预装 repo 自带工具(dataos-train/dataos-operator)。
  # dataos_tools 声明所装工具的版本(= tools/*/pyproject 的 version,有测试兜底);升级 = bump
  # 版本号 + 改声明 + scripts/sync_envs.py,此外任何 push/pull 不动 venv(版本绑死,手动更新)。
  sft_env:
    path: /data/hcgu/users/tjh/dataos_agentver/configs/environments/PTB_H100_slurm/envs/dataos_sft/.venv
    provides: [llamafactory, torch, transformers, flash-attn, dataos-train, dataos-operator, dataos-eval]
    dataos_tools: {train: "0.1.0", operator: "0.8.0", eval: "0.1.0"}
  rl_env:   {path: /data/hcgu/users/tjh/dataos_runtime/environments/PTB_H100_slurm/envs/rl/.venv,   provides: [verl, vllm, ray, torch, flash-attn]}
  eval_env: {path: /data/hcgu/users/tjh/dataos_runtime/environments/PTB_H100_slurm/envs/eval/.venv, provides: [vllm, lm-eval, torch]}

# 无 paths 段:fixed_pool / deploy_root / runs_base 都是 run 级事实(run JSON),
# benchmarks 由 task 目录推导 —— env 只描述机器本身。

gateway:                           # 从 login 节点可达的 LLM 端点(仅连接事实;model/workers 是 task 的选择)
  base_url: https://api.chatanywhere.tech/v1
  key_file: /data/hcgu/users/tjh/.chatanywhere_key   # 只记路径;OPENAI_API_KEY=$(cat key_file) 内联注入

resources:                         # 供大脑规划参考
  gpu_type: H100-80GB
  note: "一个 node 多张卡;多 run 并行各占一张"

operations:                        # ★ 操作契约:生命周期动词 → jinja2 命令模板(CONTRACT.md §4)
  activate: |-
    source {{ ctx.env_path }}/bin/activate
  submit: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} 'sbatch --partition={{ env.slurm.partition }} --qos={{ env.slurm.qos }} --gres=gpu:{{ run.resource.gpus }}{% if run.resource.node %} --nodelist={{ run.resource.node }}{% elif env.slurm.get("nodes") %} --nodelist={{ env.slurm.nodes }}{% endif %} --cpus-per-task={{ run.resource.cpus }} --chdir={{ ctx.run_root }} --output={{ ctx.run_root }}/logs/slurm-%j.out --error={{ ctx.run_root }}/logs/slurm-%j.err {{ ctx.script }}'
  poll: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} "sacct -j {{ ctx.jobid }} --format=State --noheader -n | awk '{$1=$1; print $1}' | tail -1"
  fetch: |-
    scp -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -P {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }}:{{ ctx.remote }} {{ ctx.local }}
  cancel: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} 'scancel {{ ctx.jobid }}'

discipline:                        # ★ 硬约束(CONTRACT.md §1)
  - "环境冻结:tools 里 sft/rl/eval 三个 venv 是共享冻结基线,禁止改动(不在其中 pip/uv install·uninstall、不改包版本、不动 .venv);需要不同依赖就在 environments/ 下新建一个环境,绝不动这三个。"
  - "login 节点共享脆弱:只允许写/提交 sbatch、轮询 sacct/squeue(每次 sleep ≥30s)、有界联网步骤(judge/小样本 LLM 打分);其余重活一律进 sbatch。"
  - "一切重计算(数据读写、模型运行、训练、eval 生成)必须在 Slurm GPU 作业里跑,绝不在 login 节点。"
  - "输出隔离:一切产物落 {{ ctx.run_root }};sbatch 钉 --chdir/--output;TMPDIR、TORCHINDUCTOR_CACHE_DIR、TRITON_CACHE_DIR、TORCH_HOME 重定向进 run_root,别污染共享 HOME。"
  - "TMPDIR 用短路径(如 /tmp/job_$SLURM_JOB_ID),别用 run_root 下的长路径(超 AF_UNIX 108 字符 socket 上限)。"
  - "triton/inductor 编译需 libcuda.so:部分节点(gpu01/02)只装运行时 libcuda.so.1、缺链接符号。凡触发 triton/inductor 编译的作业(RL、以及非 gpu03 上的 eval)须在 sbatch 里建 job-local 符号链接 `ln -sf <libcuda.so.1> $TMPDIR/culib/libcuda.so` 并 export LIBRARY_PATH=$TMPDIR/culib:$LIBRARY_PATH + TRITON_LIBCUDA_PATH=<其目录>,否则 gcc `-lcuda` 链接失败(CalledProcessError)。"
  - "绝不递归/全盘扫描 /data(不 grep -r / find / du);只读需要的具体文件。"
  - "瞬时网络错误重试 ssh;login 有网、compute 节点可能无网。"
  - "提交作业只用 ENV OPS 里渲染好的 submit 模板(单节点、池约束已内置);禁止自己手写 sbatch 头/加 --nodelist/--time/--nodes 等调度参数——节点池、时限、分区都由环境统一管理。"
  - "GPU Guard:集群守护会杀掉『前 30 分钟显存峰值 <24576MiB』的 job(防占卡不用)。LoRA/小模型训练峰值常仅 ~15GiB,必踩——sbatch 里在训练启动前先分配并持有一块 ≥16GiB 的常驻 CUDA tensor(如 `python -c 'import torch;x=torch.empty(16*2**30,device=\"cuda\")'`,或训练脚本首行的等效写法),把峰值抬过警戒线。"
  - "路径隔离:agent 主机的 /zssd/... 路径在集群上不存在。远端命令/sbatch 里只准出现集群路径(deploy_root、runs_base、fixed_pool——RUNTIME CONFIG 已给出);任何 agent-host 本地路径绝不许泄漏进远端命令。"
  - "不给 sbatch 显式 --time:请求超过分区上限会以 PENDING(PartitionTimeLimit) 永久排队;用分区默认时限。"
