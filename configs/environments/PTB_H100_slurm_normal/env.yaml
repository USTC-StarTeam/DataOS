# 环境契约:PostTrainBench 在 H100 Slurm 集群(hcgu)的部署(env = (task,机器) 部署单元)
# 字段规范见 DataOS-Runtime/CONTRACT.md §1。命令模板用 jinja2:
#   {{ env.* }} / {{ run.* }} 解析时(compose.resolve)填;{{ ctx.* }} 保留给 sub-agent 执行时填。
# 秘钥本身绝不入库 —— 只记 key 文件路径。

name: PTB_H100_slurm_normal
kind: slurm

access:
  host: 114.214.215.159
  user: hcgu
  port: 22
  key_ref: ~/.ssh/ghc_miyao        # 控制面本地私钥路径(不入库)

slurm:                             # 只描述这台机器的 Slurm 事实。选择(node/gpus/cpus/qos)走 run.resource。
  partition: gpu
  max_time: "3-00:00:00"           # 分区 MaxTime:超过它的申请 PENDING(PartitionTimeLimit) 永排
  default_time: NONE               # 不给 --time 会落到 QOS 的 7d 上限 > MaxTime,于是永久排队
  qos: gpu_normal
  nodes: "gpu01,gpu02,gpu03"       # 分区里有这几台。选哪台是 run.resource.node;不指定则 Slurm 自选
  gres_required: "gpu:1"           # gpu/debug 分区强制带 gres,纯 CPU 活也要占一张卡
  mem_per_gpu_mb: 125000           # 按卡给的硬上限,--mem 超了 sbatch 直接拒
  cpus_per_gpu: 11                 # 同上,--cpus-per-task 超了直接拒
  nodes_without_libcuda_link: "gpu01,gpu02"   # 只装运行时 libcuda.so.1、缺链接符号,triton/inductor 编译会失败
  guard_qos: "gpu_normal"          # 受 GPU Guard 守护的 QOS(见 prompt 的 cluster_discipline)

tools:                             # 机器预装的通用运行时(uv venv;基础框架,不含任何 agent 私有方法库)
  # uv venv = 标准 venv(bin/python);一律按 {path}/bin/<tool> 调用,无需 conda/activate。
  # 定义在 envs/*(build.sh + requirements);DataOS 使用的 venv(dataos_sft/train-cli)建在
  # deploy checkout 内(configs/environments/.../envs/*/.venv,git 忽略),rl/eval 基线仍
  # 在旧的 dataos_runtime 位置(暂不迁移)。
  # ★ 冻结:sft/rl/eval 三个 venv 是共享基线,禁止改动;需异构依赖请在 environments/ 下新建环境(见 discipline)。
  # sft_env 指向 dataos_sft:sft 基线的 DataOS 派生版,预装 repo 自带工具(dataos-train/dataos-operator)。
  # 它也带 lm-eval(版本对齐 eval_env):建数据时要用**真正的评估解析器**预检目标格式,而
  # configs/tasks/.../eval/lmeval/task.py 在导入期就需要 lm_eval 的基类。冻结的 eval_env 不可改动,
  # 所以这份依赖装在我们自己的派生 env 里(见 envs/dataos_sft/requirements.txt 的理由)。
  # ★ 训练模板必须与评估 chat template 同构(否则分数被协议封顶,不是能力):LF 至今没有 smollm3
  # (0.9.4/0.9.5/main 都没有),其 `smollm`/`smollm2` 虽然也是 ChatML(此前这里写它们是 `<|eot_id|>`
  # 格式,已实测证伪),但 `replace_eos=False` + `tool_format=default` 两项不可用;SmolLM3 要用
  # dataos-train 注册的 `smollm3`/`smollm3_nothink`。对照表见 eval/lmeval/templates/README.md。
  # ★ model_families 声明这个 env 的 transformers **认识**哪些架构(模型 config.json 的 model_type)。
  # 架构支持是依赖事实,不是 spec 能覆盖的东西:SmolLM3 要 transformers>=4.53,低于它的 env 一定在
  # 加载模型时报 Unrecognized configuration class。声明写在这里,dataos-train 只读模型自己的
  # model_type 去匹配(env_for 的 `llamafactory@<family>` 域),于是工具里不存在任何模型表。
  # 加新模型族 = 确认现有 env 能训就加进这个列表;不能训就新建 env 并只声明它那一族。
  # 列表里没有的族会在 build 时硬报错——不回落到未限定域,因为回落正是 2026-08-11 那 146 个废作业。
  # dataos_tools 声明所装工具的版本(= tools/*/pyproject 的 version,有测试兜底);升级 = bump
  # 版本号 + 改声明 + scripts/sync_envs.py,此外任何 push/pull 不动 venv(版本绑死,手动更新)。
  sft_env:
    path: /data/hcgu/users/tjh/dataos_agentver/configs/environments/PTB_H100_slurm/envs/dataos_sft/.venv
    provides: [llamafactory, torch, transformers, flash-attn, lm-eval, dataos-train, dataos-operator, dataos-eval]
    model_families: [qwen3, smollm3, gemma3]
    dataos_tools: {train: "0.1.8", operator: "0.9.0", eval: "0.3.0"}
  rl_env:   {path: /data/hcgu/users/tjh/dataos_runtime/environments/PTB_H100_slurm/envs/rl/.venv,   provides: [verl, vllm, ray, torch, flash-attn]}
  eval_env: {path: /data/hcgu/users/tjh/dataos_runtime/environments/PTB_H100_slurm/envs/eval/.venv, provides: [vllm, lm-eval, torch]}

# 无 paths 段:fixed_pool / deploy_root / runs_base 都是 run 级事实(run JSON),
# benchmarks 由 task 目录推导 —— env 只描述机器本身。

gateway:                           # 从 login 节点可达的 LLM 端点(仅连接事实;model/workers 是 task 的选择)
  base_url: https://api.chatanywhere.tech/v1
  key_file: /data/hcgu/users/tjh/.chatanywhere_key   # 只记路径;OPENAI_API_KEY=$(cat key_file) 内联注入

resources:                         # 供大脑规划参考
  gpu_type: H100-80GB
  note: "一个 node 多张卡;多 run 并行各占一张"

operations:                        # ★ 操作契约:生命周期动词 → jinja2 命令模板(CONTRACT.md §4)
  activate: |-
    source {{ ctx.env_path }}/bin/activate
  submit: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} 'sbatch -N1 -n1 --time=12:00:00 --partition={{ env.slurm.partition }} --qos={{ env.slurm.qos }} --gres=gpu:{{ run.resource.gpus }}{% if run.resource.node %} --nodelist={{ run.resource.node }}{% elif env.slurm.get("nodes") %} --nodelist={{ env.slurm.nodes }}{% endif %} --cpus-per-task={{ run.resource.cpus }} --chdir={{ ctx.run_root }} --output={{ ctx.run_root }}/logs/slurm-%j.out --error={{ ctx.run_root }}/logs/slurm-%j.err {{ ctx.script }}'
  poll: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} "sacct -j {{ ctx.jobid }} --format=State --noheader -n | awk '{$1=$1; print $1}' | tail -1"
  fetch: |-
    scp -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -P {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }}:{{ ctx.remote }} {{ ctx.local }}
  cancel: |-
    ssh -i {{ env.access.key_ref }} -o IdentitiesOnly=yes -p {{ env.access.port }} {{ env.access.user }}@{{ env.access.host }} 'scancel {{ ctx.jobid }}'
