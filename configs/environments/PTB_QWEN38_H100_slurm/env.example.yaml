# Copy to env.yaml and fill machine-specific paths; do not upgrade an existing PTB venv.
name: PTB_QWEN38_H100_slurm
kind: slurm
access: {host: "<login-host>", user: "<user>", port: 22, key_ref: "<ssh-key-path>"}
slurm:
  partition: gpu
  qos: "<qos>"
  default_time: NONE
  mem_per_gpu_mb: 125000
  cpus_per_gpu: 11
  gres_required: "gpu:1"
  partitions:
    gpu:
      nodes: "<node>"
      max_time: "3-00:00:00"
      qos_available: ["<qos>"]
tools:
  sft_env:
    path: "<dedicated-qwen38-venv>"
    provides: [llamafactory, torch, transformers, lm-eval, dataos-train, dataos-operator, dataos-eval, dataos-data]
    model_families: [qwen3_5]
    dataos_tools: {dataos-tools: "0.5.6", operator: "0.10.0"}
  eval_env:
    path: "<dedicated-qwen38-venv>"
    provides: [vllm, lm-eval, torch]
resources: {gpu_type: H100-80GB}
