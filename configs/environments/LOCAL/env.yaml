# 环境契约:PostTrainBench 在**本机工作站**的部署(env = (task,机器) 部署单元)。
# 与 PTB_H100_slurm 的差别只有一句话:作业不去别的机器,所以没有 ssh、没有 Slurm、没有守护进程。
# 评估协议、数据配方、训练方法都不因机器而变 —— 变的只有"谁来启动这个作业"。
# 字段规范见 configs/CONTRACT.md §1。

name: LOCAL
kind: local                        # ★ 决定运行时必须提供什么:local 不要求 ssh 坐标与分区
                                   #   (见 dataos.agent.runtime._REQUIRED_CLUSTER_KEYS)
launcher: local                    # dataos-launch 的注册名;dataos-eval/-train 据此选执行器

access: {}                         # 本机执行:没有主机、用户、端口、私钥可言

resources:
  gpu_type: RTX-5090-32GB
  # ★ 32GB,不是 H100 的 80GB。凡按 80GB 标定的数字在这里都不成立:
  #   protocol.yaml 的 gpu_memory_utilization(0.3/0.8)是显存**比例**所以能沿用,
  #   但全参训练一个 4B 模型需要约 64GB 优化器状态 —— 本机装不下,只能 LoRA 或更小的模型。
  note: "8 张卡共享一台工作站;本机同时是 agent 主机,别把卡占满"

tools:
  # 本机 venv(uv),建在**仓库之外**的 DataOS-Space:venv 有十几 GB,模型和数据更大,它们是
  # "这台机器的资产"而不是"这份代码的一部分"。构建脚本在 DataOS-Space/envs/*/build.sh。
  # 与集群那三个冻结 venv 不是同一套依赖 ——
  # ★ 因此本机分数与 H100 分数**不可比**:不同的 torch/vllm/transformers 会改变生成与解析。
  #   本环境的用途是"跑得通、改得快",不是产出可对外比较的成绩。
  sft_env:
    path: /zssd/home/tangjiahui/2026/DataOS-Space/envs/dataos_sft/.venv
    provides: [llamafactory, torch, transformers, lm-eval, dataos-train, dataos-operator, dataos-eval, dataos-data]
    model_families: [qwen3, smollm3, gemma3]
    dataos_tools: {tools: "0.4.0", operator: "0.9.0"}
  eval_env: {path: /zssd/home/tangjiahui/2026/DataOS-Space/envs/eval/.venv, provides: [vllm, lm-eval, torch]}

gateway:                           # judge bench 要联网打分;本机有网,沿用同一个端点
  base_url: https://api.chatanywhere.tech/v1
  key_file: ~/.chatanywhere_key

operations:                        # ★ 与集群同名同义的动词,只是不再经过 ssh
  activate: |-
    source {{ ctx.env_path }}/bin/activate
  submit: |-
    bash {{ ctx.script }} > {{ ctx.run_root }}/logs/local.out 2>&1 &
    echo $!
  poll: |-
    kill -0 {{ ctx.jobid }} 2>/dev/null && echo RUNNING || echo COMPLETED
  fetch: |-
    cp {{ ctx.remote }} {{ ctx.local }}
  cancel: |-
    kill {{ ctx.jobid }}

discipline:                        # ★ 硬约束:本机版
  - "环境冻结:tools 里的 venv 由 scripts/ 建立并由 dataos_tools 声明版本;禁止在实验过程中 pip install 改动它们 —— 需要不同依赖就新建一个 environments/ 条目。"
  - "★ 本机既是 agent 主机也是计算机器:agent 进程、监控和训练共用这 8 张卡与 128 核。跑之前先 `nvidia-smi` 看空卡,只用空闲的;绝不 `--gres` 式地假设整机独占。"
  - "★ 显存 32GB/卡,不是 80GB。全参微调 4B 模型(约 64GB 优化器状态)装不下,只能 LoRA;需要全参就换更小的基座。按 80GB 标定的配方直接搬过来会 CUDA OOM。"
  - "没有 GPU Guard、没有 QOS、没有排队上限 —— 这些是集群的机制,本机一概不存在。绝不要分配显存占位、也不要起 matmul 空转线程。"
  - "没有 Slurm:不要写 sbatch/sacct/squeue/scancel。作业由 dataos-launch 的 local 执行器起成子进程,状态从 pid + rc 文件读。"
  - "输出隔离:一切产物落 {{ ctx.run_root }};TMPDIR、TORCH_HOME、TRITON_CACHE_DIR、TORCHINDUCTOR_CACHE_DIR 重定向进 run_root,别污染共享 HOME。"
  - "TMPDIR 用短路径(如 /tmp/job_$$),别用 run_root 下的长路径(超 AF_UNIX 108 字符 socket 上限)。"
  - "本机装依赖必须关代理并走镜像源(HTTP(S)_PROXY 指向的代理到 pypi 不通):`env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY UV_DEFAULT_INDEX=https://pypi.tuna.tsinghua.edu.cn/simple uv sync`。"
  - "★ 本机分数与 H100 批次不可比:依赖栈不同(torch/vllm/transformers 版本),生成与解析都会变。本环境用于验证流程跑得通,不用于产出对外成绩;要可比的分数请在冻结环境里重跑。"
