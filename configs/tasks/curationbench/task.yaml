# 任务契约:Curation-Bench(VLM 数据策展,github.com/feiyang-k/curation-bench)
# 字段规范见 CONTRACT.md §2。agent 唯一杠杆 = 选哪些行(DATA);三段 driver 都由
# 本文件链接的 task contract 显式选择,不从目录名或 task 名推断。
#
# 三段:DATA(agent 造子集)→ TRAIN(冻结 finetune,见 train/task.yaml,产出模型)→
#       EVAL(对那个模型跑 VLMEvalKit 8 基准,和 posttrainbench 同形:model → score)。
#
# 打分 harness(datacuration-bench CLI + vendored curation-train + VLMEvalKit,~1TB)不 vendor
# 进本库；checkout/venv/eval data 都由 environment 的工具 provider 固定。

name: curationbench

# Agent-loop protocol facts. They change which parts of the benchmark exist, not the curation
# strategy: Curation-Bench has no PTB source profiler, its first scored run is an official random
# curation baseline, and every iteration resets to the task's frozen root model.
agent:
  preflight_repair:
    max_revisions: 2
    plan_template: curationbench/leader/turn/repair
  budget:
    unit: iterations
    coordinator: suite.py
  investigator: false
  baseline:
    name: random-baseline
    hypothesis: "official Curation-Bench random selection baseline"
    estimated_hours: 10
    data:
      recipe:
        - op: official_random_baseline
          params: {source: "pinned harness curation/curate.py", seed: 123}
    expected_signal: "reference accuracy for all later curation strategies"
    subagent_brief: "Copy and run the pinned harness's default random curate.py unchanged."
  model_initialization: root
  context:
    leader: [curationbench/leader/context/role]
    experimenter: [curationbench/experimenter/context/role]
  turns:
    leader_plan: curationbench/leader/turn/plan
    experimenter: curationbench/experimenter/turn/experiment
    review_stage: curationbench/experimenter/turn/stage_review

stages:
  data:
    stage: data
    driver: dataos-data
    ownership: agent
    tool: datacuration-bench
    toolbox: dataos-operator
    toolbox_prompt: curationbench/experimenter/turn/operator_toolbox
    dataset_backend: indexed
    input: "the external task's frozen dataset plus this node's curation strategy"
    output: "{ctx.submission_path} — the official exact-size multimodal submission"
    invoke: |-
      Code has already created this DataOS run's one official N-iteration suite and activated
      exactly one target for this durable tree node. Use the supplied {ctx.suite_dir} and
      {ctx.submission_path}; never run `datacuration-bench init` or `next` yourself. First run
      `{{ env.tools.curation_bench.path }}/bin/datacuration-bench plan --suite-dir {ctx.suite_dir}`
      and confirm the supplied target is active (or already completed during crash recovery),
      then inspect the frozen task with
      `{{ env.tools.curation_bench.path }}/bin/datacuration-bench task --suite-dir {ctx.suite_dir}`;
      confirm its dataset/model paths equal `{{ run.fixed_pool }}` / `{{ run.base_model }}` before
      spending GPU time.
      Create an isolated git worktree of `{{ env.tools.curation_bench.root }}` at its configured
      revision under {ctx.run_root}/harness_worktree. Never edit the provider checkout itself.
      In that worktree create this experiment's own autoresearch branch; only its `curation/`
      files may change. Work only in this experiment's worktree and this run's shared suite. Read
      prior targets in that suite when the strategy needs their predictions or scores; prior
      curation code remains in this run's earlier committed experiment worktrees. Never read
      another DataOS run's suite. Write the selection implementation in the worktree's `curation/`
      and commit it on the isolated branch. Write a
      thin {ctx.run_root}/run_curation.py that invokes that script with the task-reported dataset,
      submission path, and target_rows using `{{ env.tools.sft_env.path }}/bin/python`.
      Submit the wrapper through
      `{{ env.tools.sft_env.path }}/bin/dataos-data probe \
      --repo {{ run.deploy_root }} --environment {{ run.environment }} \
      --run-root {ctx.run_root} --recipe run_curation.py \
      --gpus 0 --cpus {{ run.resource.cpus }}{% if run.resource.get("qos") %} --qos {{ run.resource.qos }}{% endif %}{% if run.resource.get("partition") %} --partition {{ run.resource.partition }}{% endif %}{% if run.resource.get("node") %} --nodelist {{ run.resource.node }}{% endif %}`.
      Poll `{ctx.run_root}/data_handle.json` with `dataos-data status`; do not write an sbatch file.
      The default declares CPU-only curation: this cluster still allocates its mandatory GPU and
      dataos-launch installs the gpu_normal guard. A strategy that genuinely executes CUDA work
      may instead pass the configured GPU count, but then it must actively satisfy the guard.
      The wrapper must propagate the curate process's exit code and produce exactly the
      task-declared row count at {ctx.submission_path}. The dataset must be a
      HuggingFace save_to_disk dataset with `images` and `texts` columns. Use the declared
      dataos-operator toolbox where its indexed operators fit; never convert the multimodal rows
      to Alpaca or rebuild selected image payloads from Python records.
  train: {contract: train/task.yaml}
  eval: {contract: eval/task.yaml}

inputs:
  base_model:    {from: run.base_model, kind: hf_model}
  data_pool:     {from: run.fixed_pool, kind: hf_dataset}     # 候选池(LLaVA-665K / VisionFlan)
  bench_task_id: {from: run.bench, kind: enum,
                  one_of: [llava665k_llava_8bench_10k_unlimited, llava665k_llava_8bench_20k_unlimited,
                           llava665k_llava_8bench_50k_unlimited, llava665k_qwen_8bench_10k_unlimited,
                           llava665k_qwen2vl2b_8bench_10k_unlimited, llava665k_smolvlm_8bench_10k_unlimited,
                           visionflan_llava_8bench_20k_unlimited, visionflan_smolvlm_8bench_10k_unlimited]}
  bench_root:    {from: env.tools.curation_bench.root, kind: path}

objective: "按 bench_task_id 冻结的行数预算从 data_pool 选择子集;经官方冻结配方 finetune 后,使模型在 8 个 VLM 基准上的归一化平均分最大化。"

constraints:
  - "只能选池内的行;提交前必须记录污染审计(SHA-256 精确 + 8-gram 近重复 token 重叠≥0.8);high_risk 是报告与修订信号,不是 harness 的硬拒绝门。"
  - "子集行数必须 == 官方 task 的 target_rows;列为 images + texts;HF save_to_disk 格式。"
  - "训练配方、基座模型、评测基准全部冻结:不得改 harness 的 vendor/src/configs/任务 YAML,不得改超参。"
  - "只允许编辑 harness 的 curation/ 目录(策展代码);怎么选(过滤/去重/质量分/多样性/配比)完全自定。"

produce:
  kind: hf_model
  hint: "最终被打分的产物是【模型】(冻结 finetune 的产出,位于 harness run_dir 的 finetune/);agent 的 DATA 杠杆产出的是子集(经 audit+submit 交付给 train)。"

# EVAL 契约:只评一个模型(和 posttrainbench 同形)。driver 细节见 eval/task.yaml。
scoring:
  evaluator: "dataos-eval external_cli driver → official datacuration-bench eval/VLMEvalKit"
  judge: {model: qwen3.5-plus, workers: 128}
  command: |-
    {{ env.tools.sft_env.path }}/bin/dataos-eval submit --repo {{ run.deploy_root }} --environment {{ run.environment }} --task-config {{ run.task }} --task {{ run.bench }} --model-path {ctx.model_path} --model-name {ctx.label} --output-dir {ctx.eval_dir} --run-root {ctx.run_root} --suite-dir {ctx.suite_dir} --limit -1 --gpus {{ run.resource.gpus }} --cpus {{ run.resource.cpus }}{% if run.resource.get("qos") %} --qos {{ run.resource.qos }}{% endif %}{% if run.resource.get("partition") %} --partition {{ run.resource.partition }}{% endif %}{% if run.resource.get("node") %} --nodelist {{ run.resource.node }}{% endif %}
  result:
    file: "{ctx.eval_dir}/summary.json"
    field: score
    range: [0, 1]
  aggregate:
    rule: "accuracy = mean(score_b / max_b for b in target_evals)"
    max: {MMVet: 100, LLaVABench: 100, OCRBench: 1000, HallusionBench: 100,
          MMMU_DEV_VAL: 100, MathVista_MINI: 100, MMStar: 100, MMBench: 100}
  format_contract: "{{ env.tools.curation_bench.root }}/BENCHMARK.md"
