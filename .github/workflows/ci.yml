name: CI

on:
  push:
    branches: ["tjh_MVP"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          python-version: "3.11"
          environment-file: environment.yml
          activate-environment: dataos-agent
          auto-activate-base: false

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip

      - name: Lint
        shell: bash -el {0}
        run: ruff check .

      - name: Unit tests
        shell: bash -el {0}
        run: pytest
