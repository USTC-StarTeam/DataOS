description: >
  Investigator task message — one-shot intel gathering before any training. Render params:
  target_bench, base_model, fixed_pool, deploy_root, eval_env_python, cluster_json,
  profile_script, lm_bridge, recon_path.
template: |
  Gather ground-truth intel and write ONE file — the recon report — to:
    {{ recon_path }}   (a LOCAL path on THIS host; write it with your shell)

  TARGET benchmark: {{ target_bench }}
  Base model on H100: {{ base_model }}
  Fixed pool (on H100): {{ fixed_pool }}
  H100 cluster (ssh): {{ cluster_json }}
  Deploy repo on H100 (AGENTVER): {{ deploy_root }}
  Eval-env python on H100: {{ eval_env_python }}
  Source profiler script (in the deploy repo): {{ profile_script }}

  ssh to the H100 login node with the cluster block above (`ssh -i <key> -p <port>
  -o IdentitiesOnly=yes <user>@<host> '…'`). Login-node discipline is in your system prompt —
  read only the specific files/paths named here.

  Produce recon.json with EXACTLY these four parts:

  1. eval_format_contract — follow the eval-format guidance in your system prompt: the bench
     task/scorer lives under `{{ lm_bridge }}/` (the eval bridge in the DataOS-Runtime task dir);
     read the {{ target_bench }} task + its scorer/parser and record `parser` /
     `format_sensitive` / `expected_target_shape` / `target_example`.

  2. baseline_diagnosis — decide whether the BASE model's low score is a FORMAT miss or a real
     CAPABILITY gap. Cheapest path: read a handful of the base model's raw generations if any exist
     under the runs tree; otherwise run a TINY generation (a few examples) or reason from the base
     model + eval contract. Set cause to "format" (base emits the right idea in the wrong shape —
     fixable by aligning the target template) or "capability" (base fundamentally can't do the task
     — needs full-SFT / more data). Include short `evidence`. If you truly cannot tell cheaply, set
     cause "unknown" with a note — do NOT run a full GPU eval just for this.

  3. candidate_sources — the SHORTLIST for the leader. From the profiles + your notes, pick the
     sources (or source+subset) the leader is most likely to need for THIS bench:
     [{"source": "...", "subset": "<optional, e.g. a composition value>", "why": "...",
       "conversion": "<what the target side must become for this bench>"}, ...]
     A good shortlist is 3-8 entries, ordered by expected usefulness; mark the rest with a
     one-line exclusion reason (whole shapes like classification/translation may be excluded
     as a group). Judge against the eval_format_contract, not vibes.

  4. source_profiles — run the deterministic profiler over the WHOLE pool (it's cheap, ~minutes):
     ```bash
     ssh <login> '{{ eval_env_python }} {{ profile_script }} \
       --pool-root {{ fixed_pool }} --all-sources'
     ```
     The script prints a JSON array of per-source RAW STATISTICS (n_rows, splits, schema,
     shape, composition, domain {label, scores}, lengths, output_format fractions,
     negatives rate, real samples — no quality verdicts and no format-fit score by design:
     format fit is a judgment, and THAT judgment is yours). Field guide: `shape` is
     the row archetype (alpaca/qa/chat/chat_tools/preference/classification/raw_text/
     translation/mcq) — it decides the conversion path (preference = take `chosen` or go
     DPO; classification/translation are not instruction data); `composition` is the exact
     per-subset breakdown of any low-cardinality column (e.g. problem_source) — pick the
     SUBSET that fits, not just the source; `lengths` (p50/p95/max chars per side) grounds
     the cutoff_len choice. Then ANNOTATE: for each source, add a `note` field — 1-2
     sentences saying what the content actually is and what (if anything) must be
     converted for THIS bench, judged against the eval_format_contract you just recorded
     (e.g. "math CoT with LaTeX \\boxed answers; needs re-rendering to the
     `#### <number>` shape"). Keep every profile's stats verbatim — annotate, never
     rewrite the numbers. Put the annotated array in as `source_profiles`.
     ⚠️ If a profile carries a `degraded` mark or looks self-contradictory (n_rows > 0 but
     an empty sample / zeroed stats), do NOT write "do not select" from it — load a few
     rows of that source yourself (`load_from_disk` + print one row) and judge from the
     real row. A degraded profile means "the profiler couldn't see", never "the source
     is bad".

  Then write recon.json locally as:
  {
    "eval_format_contract": {"bench": "{{ target_bench }}", "summary": "...", "parser": "...",
                             "format_sensitive": true, "expected_target_shape": "...",
                             "target_example": "..."},
    "baseline_diagnosis":   {"cause": "format|capability|unknown", "evidence": "..."},
    "candidate_sources":    [ {"source": "...", "subset": "...", "why": "...",
                               "conversion": "..."} ],
    "source_profiles":      [ <the profiler's JSON array, verbatim + your notes> ]
  }

  Write the file, confirm it parses as JSON, then stop. That file is your entire deliverable.
