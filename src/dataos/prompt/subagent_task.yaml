description: >
  Per-experiment task prompt handed to the execution sub-agent. Render params: exp_name, bench,
  profile, parent_model, root_base_model, node_id, parent_node_id, eval_limit, is_smoke,
  recipe_json, train_json, subagent_brief, runtime_config_json, run_root, report_path,
  state_path, env_ops, task_def, stage_blocks, run_config_json, remaining_minutes (optional).
template: |
  Implement experiment '{{ exp_name }}' (bench={{ bench }}, profile={{ profile }}).
  Parent model to continue training from (use this exact path): {{ parent_model }}
  Root base model for provenance only: {{ root_base_model }}
  Tree node: {{ node_id }} parent={{ parent_node_id }}
  sampled eval limit: {{ eval_limit }}{% if is_smoke %}    smoke→cap data to ≤1000 rows{% endif %}
  {% if remaining_minutes is defined and remaining_minutes %}
  TIME BUDGET: ~{{ remaining_minutes }} minutes of wall-clock remain for THIS experiment. Pace to FINISH within it: size training (n_samples / steps) to fit, run the sampled eval, and WRITE report.json before time runs out — a partial or failed report still counts, getting killed with no report does not. Do not schedule far-out wakeups; poll tightly and finish ASAP.
  {% endif %}

  DATA RECIPE (main-agent intent — preserve it; use minimal mechanical compatibility fixes if needed and record them in report.json):
  {{ recipe_json }}
  SFT hyperparameters (fixed unless an execution tool requires a harmless format cast):
  {{ train_json }}
  {% if train_spec_json %}
  TRAIN SPEC (ready for dataos-train — runtime-owned fields injected by code, do NOT edit them; write this verbatim to {ctx.run_root}/trainspec.json and follow the train stage's invoke):
  {{ train_spec_json }}
  {% endif %}
  RUN CONFIG (write verbatim to {ctx.run_root}/run_config.json — the common eval runner reads it to score your model in the EVAL stage):
  {{ run_config_json }}
  Main-agent brief:
  {{ subagent_brief }}

  RUNTIME CONFIG (authoritative for the paths / model / conda envs your data-building & training METHOD needs — deploy_root/$AGENTVER, fixed_pool, train_env, etc.):
  {{ runtime_config_json }}

  H100 scratch for this experiment: RUN_ROOT={{ run_root }}
  Write the report to this LOCAL path (absolute): {{ report_path }}
  Keep durable execution state at this LOCAL path: {{ state_path }}

  The ENVIRONMENT OPS and TASK below are rendered from the DataOS-Runtime contract for THIS run (env/run values already filled). `{ctx.*}` are placeholders YOU fill at execution time: run_root / env_path / script / jobid / model_path / eval_dir / label / remote / local. The TASK defines the problem + how it is scored, NOT how to solve it.

  {{ env_ops }}

  {{ task_def }}

  Your pipeline is the three STAGES below — same shape, different owners: `data` and `train` are OUR method (improvable; details in your system prompt), `eval` is PROVIDED (the frozen scorer — never modify it):

  {{ stage_blocks }}

  Execute the stages end to end (data+train fold into ONE Slurm job — the compute node has the pool AND the GPU; use the submit/poll ops). Self-heal execution failures (operator-port/data-port mismatches, etc.) with minimal compatibility fixes that preserve the intent, and record them in report.json. If a Slurm job is still running, keep polling it to terminal state; do not return a final prose-only update.
  REPORT CONTRACT (this is OURS, not the runtime's — the common eval runner produces {ctx.eval_dir}/score.json; YOU assemble it into report.json for our search tree). Write report.json to the LOCAL path above with this exact shape:
    {"id":"<node_id>","name":"<name>","status":"completed",
     "score":<float — score.json `score`, or null>,
     "stages":{"data":{"status":"completed"},"train":{"status":"completed"},"eval":{"status":"completed"}},
     "dataset":{"rows":<int>},
     "model":{"path":"<the scored model dir>","base_model":"<BASE>"},
     "eval":{"score":<float>,"per_task":<score.json metrics>,"path":"<eval_dir>"}}
  `status:"completed"` only if `score` is a real number read from score.json; otherwise `status:"failed"` with an `"error"` string. On a BASELINE run set stages data/train to `{"status":"skipped"}`. ALWAYS write a report at the end — never crash without one; a failed report is still required. Record any compatibility fixes / format-pre-check outcome in report.json.
  FORMAT PRE-CHECK (inside the sbatch script, after building data and BEFORE the training step): if this bench's eval extracts a structured answer by PARSING model output (tool call / code / JSON / MCQ letter — NOT a free-text LLM judge), take 3 of the built `output` targets and run them through the SAME parser the sampled eval will use. If it cannot extract a valid structure from your own targets, the format is misaligned — you would train the model to emit something the scorer cannot read, capping the score regardless of data or hyperparameters. Abort before training, fix the recipe's rendering step so the target matches `expected_target_shape`, re-check, then train. Record the pre-check outcome (passed, or what you changed) in report.json.
  You are responsible for operator-port and dataset-port adaptation: inspect installed operator signatures inside the Slurm job, normalize fixed-pool source records into the fields needed by the operators and the LLaMA-Factory alpaca format, and record any compatibility notes in report.json.
  You are responsible for keeping GPU utilization high within the single-GPU budget: avoid login-node work, batch data work with training where possible, choose reasonable dataloader workers/batch/grad-accum/vLLM concurrency, and report any resource bottleneck.
  Do not run Python data/operator inspection on the H100 login node. Your first remote actions should be limited to mkdir/cat a job script, sbatch it, and poll Slurm. Put dataos/dataos_operator imports and fixed-pool reads inside the sbatch script.
  Important local facts: the remote deploy repo uses src layout, so remote Python commands that import dataos need PYTHONPATH=$AGENTVER/src:$AGENTVER. When ssh/scp uses the configured cluster.key, pass -o IdentitiesOnly=yes to avoid local agent key-flood failures.
