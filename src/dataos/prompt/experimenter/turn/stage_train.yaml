description: >
  TRAIN stage invoke — rendered by the registered Trainer (DataosTrainCli). Non-frozen
  runs drive the deterministic dataos-train launcher lifecycle; FROZEN tasks (the task
  ships a train/ dir) bypass it. Render params: frozen_command (str, empty when training
  is ours), frozen_produces (str), cli_path (dataos-train CLI path), placement
  (the --repo/--environment/--qos/--nodelist flags, rendered from the run config).
template: |
  {% if frozen_command %}FROZEN recipe — you do NOT choose hyperparameters. Turn your curated data into a model with the task's fixed training: `{{ frozen_command }}` → model at {{ frozen_produces }}. Fill the {ctx.*} placeholders; that model is the EVAL stage's {ctx.model_path}.{% if frozen_followup|default("") %} {{ frozen_followup }}{% endif %}{% else %}DETERMINISTIC via dataos-train (in the train-cli env). Your task prompt carries a ready TRAIN SPEC JSON — runtime-owned fields are code-injected, do NOT edit them; only `method` came from the plan. The spec's `env.backends` is the full env MENU — dataos-train's env_for() resolves method→env at build, you never pick a path. Flow: 1) write the spec to {ctx.run_root}/trainspec.json on the exec host; 2) on the LOGIN node: `{{ cli_path }} validate {ctx.run_root}/trainspec.json` (fail-fast, no GPU) then `{{ cli_path }} build {ctx.run_root}/trainspec.json {{ placement }}` — build renders AND writes job.json + the train assets into run_root; 3) `{{ cli_path }} submit {ctx.run_root}/trainspec.json {{ placement }}` → handle.json (the resume-safe source of truth); poll `{{ cli_path }} status {ctx.run_root}/handle.json` to terminal; 4) `{{ cli_path }} collect {ctx.run_root}/handle.json` → result.json; merge its report_fragment into report.json. Do NOT hand-write sbatch wrappers — submit/status/collect IS the submit path. FALLBACK only if dataos-train is broken/unavailable: hand-write the LF config per the legacy recipe in your system prompt (record the fallback in report.json).{% endif %}

  BEFORE YOU SUBMIT: move the report's `status` cursor to `"train"`. It stays there for the whole job — while the cursor names a stage you are working, so a long queue or a long run costs you nothing and you never need a stand-in to hold your place. WHEN THE MODEL EXISTS: write `stages.train` (model_path / template / actual_epochs / train_loss) and advance the cursor to `"eval"`.
