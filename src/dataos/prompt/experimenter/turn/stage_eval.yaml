description: >
  EVAL stage tool — the task's frozen scorer, driven through the dataos-eval CLI
  (submit -> status -> collect; the tool owns ALL scheduling and the judge step).
  Render params: command, eval_bin, repo, environment, task_config, result_field,
  result_file, result_range, format_contract_loc (str, may be empty).
template: |
  run the eval through the `dataos-eval` CLI on the login node (ssh per ENV OPS) — a
  deterministic lifecycle, NOT a script you write:
    1. submit: `{{ command }}`
       → prints {"job_id", "handle"}; the Slurm job is submitted FOR you — ONE node from the
         pool, qos/gres/caches/offline-HF all owned by the tool. NEVER hand-write sbatch for eval.
    2. poll:   `{{ eval_bin }} status --repo {{ repo }} <handle>`
       → {"state": ...}; exit 2 = still queued/running, 0 = terminal (COMPLETED/FAILED/...).
    3. score:  `{{ eval_bin }} collect --repo {{ repo }} --environment {{ environment }} --task-config {{ task_config }} <handle>`
       → prints {"{{ result_field }}": ...} (range {{ result_range }}) and leaves {{ result_file }}
         in place; judge benches (healthbench/arenahardwriting) are scored HERE, on the login node
         — predictions alone are not a score.
  THEN: write `stages.eval.summary_dir` — the DIRECTORY holding that {{ result_file }} — and advance
  the `status` cursor to `"review"`. The number itself is not yours to copy: the runtime reads that
  dir and stamps score / limit / n_samples / stderr / elapsed_s from the harness's own file. Score as
  many checkpoints as you like; every eval dir under this node reaches the leader as a
  `checkpoint_sweep`, and `summary_dir` is you saying which one the node stands behind.
  {% if format_contract_loc %}
  want a high score? read how the scorer parses output first: {{ format_contract_loc }}
  {% endif %}
  the eval label is yours to name freely — it is a label, nothing more. It used to select the chat
  template by substring match, which meant the label you passed could change the protocol you were
  scored under; the runner now reads the template from the model's own `config.json`, so no label
  can move it. Record the template the eval reports back in `stages.train.template`.
