description: >
  DATA stage tool — the dataos_operator toolbox, submitted through the dataos-data CLI.
  Render params (facts, every one resolved from env.yaml): catalog (the installed operator
  catalog string), data_bin (the dataos-data CLI path), data_env (the venv the recipe runs in),
  provides (what that venv ships), placement (the --qos/--nodelist flags from the run config).
  The venv and its contents used to be prose here, naming one deployment's directory in a file
  that is rendered for every deployment.
template: |
  dataos_operator recipe (discover: `python -c "import dataos_operator as o; print(o.guide())"` / `o.usage('<op>')`) + hand-written prep scripts where the toolbox lacks a step; custom ops via DATAOS_OPERATOR_PLUGINS — full mechanics in your system prompt

  Your recipe is a plain Python script; submit it through the `dataos-data` CLI — the same
  deterministic lifecycle the other two stages use, NOT an sbatch wrapper you write:
    1. write the recipe to {ctx.run_root}/build_data.py on the exec host
    2. submit: `{{ data_bin }} submit --repo {ctx.deploy_root} --environment {ctx.environment} --run-root {ctx.run_root} --recipe {ctx.run_root}/build_data.py {{ placement }}`
       → the job's shell is the tool's: short TMPDIR (a run-root-relative one exceeds the
         108-char AF_UNIX socket limit), caches out of the shared HOME, offline HF, venv
         activation, and DATAOS_OPERATOR_PLUGINS pointed at {ctx.run_root}/custom_operators so a
         run-local operator resolves by name. Do not re-derive any of it.
    3. poll: `{{ data_bin }} status {ctx.run_root}/data_handle.json` → {"status": ...}

  The recipe runs in `{{ data_env }}`, which ships: {{ provides }}. Those are PREINSTALLED —
  never vendor them, pip-install them, or hunt for them.

  OUTPUT CONTRACT — write the kept rows ONE way: a Hugging Face dataset at
  {ctx.run_root}/data/sft (`dataset.save_to_disk(...)`). The submitted job derives LLaMA-Factory's
  `train.json` + `dataset_info.json` from it and then checks the result, so "built nothing" fails
  the BUILD rather than the training job downstream. Rows may be alpaca
  (`{instruction,input,output}`) or `messages` — the same converter the training job uses does the
  projection. Writing your own `train.json` is allowed and is then taken as authoritative, but it
  buys nothing: hand-transcribing the rows a second time is where this stage used to fail.

  The operator toolbox installed for this run (the brain's pinned dataos-operator; inside the job confirm with `o.catalog()` and prefer `o.usage('<name>')` for exact signatures):
  {{ catalog }}

  WHEN THE ROWS ARE ON DISK: write `stages.data` (rows / requested_rows / fingerprint) and move the
  report's `status` cursor to `"train"`.
