description: >
  KB block — how training is executed (dataos-train trainspec flow, template consistency,
  legacy LLaMA-Factory fallback, artifact layout). Audience: experimenter. No render params.
template: |
  - TRAINING IS ALSO OUR METHOD (the task contract defines only the goal + how it is scored, not how
    to train), and it is DETERMINISTIC via dataos-train: your task prompt carries a ready TRAIN SPEC
    JSON — follow the train stage's invoke (write trainspec.json → `dataos-train validate` + `build`
    on the login node → `dataos-train submit --repo/--environment` → poll `status` → `collect` → merge
    its report_fragment into report.json). Do NOT hand-write sbatch wrappers — submit/status/collect
    IS the submit path (handle.json is resume-safe). Do NOT hand-edit the spec's runtime-owned fields
    (base_model/run_dir/dataset/env); only `method` reflects the plan. There is no placement
    field to edit either — partition/QOS/node are the deployment's, resolved at submit.
    Write the kept data rows as alpaca (`{instruction,input,output}`) into `$RUN_ROOT/data/sft` —
    that is the dataset the spec points at. The chat `template` is NOT yours to set — dataos-train
    derives it from the model's own `config.json` `model_type`, and a spec that names a different
    one is REFUSED at build. If a training job dies with "Template X does not exist", that is a
    platform bug to report in report.json, NOT a cue to substitute another family's template: doing
    so trains the model on turn tokens the frozen scorer never sends, which caps the score with
    nothing in any log (it happened, and it produced a run's top score under a prompt carrying no
    system turn at all). `$RUN_ROOT/final_model` MUST end up a COMPLETE HF model (dataos-train's build
    handles the LoRA export/merge). LEGACY FALLBACK (only if dataos-train is broken — record it in
    report.json): hand-write the LF config yourself — dataset_info.json next to train.json, a
    train.yaml mapping the plan's `train` keys, `llamafactory-cli train`, and for LoRA
    `llamafactory-cli export --model_name_or_path <PARENT> --adapter_name_or_path $RUN_ROOT/adapter
    --finetuning_type lora --export_dir $RUN_ROOT/final_model`. Deterministic artifact layout either
    way: `$RUN_ROOT/{data/sft, adapter, final_model, eval/<bench>_limit<N>, logs}`.
  - TRAJECTORY CHECKPOINTS — if the plan's train knobs carry `save_steps`, this experiment is
    sampling its own training curve, and that changes what you deliver: not "the final model" but
    "the best point on this run". dataos-train renders `save_strategy: steps` plus
    `save_only_model: True` (no optimizer state — a checkpoint here exists to be EVALUATED and to
    be continued from as a fresh run, both of which need weights alone), and full-parameter
    checkpoints land in `$RUN_ROOT/final_model/checkpoint-<step>/`, each a COMPLETE HF model dir
    you can point an eval at directly. `save_total_limit` keeps the most recent K and deletes the
    oldest DURING training, so what survives to the end is the last K, not a spread — if fewer
    checkpoints exist than the plan implies, say so in the report rather than silently scoring
    what is left. A LoRA checkpoint is NOT this: it holds `adapter_model.safetensors` and no
    `config.json`, so it is a delta with no model to load — never point an eval at one.
