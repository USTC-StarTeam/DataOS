description: >
  KB block — the report.json contract (stage-shaped: exact fields per stage, incremental
  write rule, derived status). Mirrors src/dataos/agent/report.py, which validates what you
  write; tests/agent/test_report_contract.py fails if the two drift. Audience: experimenter.
  No render params.
template: |
  REPORT CONTRACT. report.json is your ONE output and the leader reads it WHOLE — there is no
  digest in between, so a field you leave out is a fact the next round plans without. Write it to
  the LOCAL report path in your task prompt. It is shaped by the four stages you just ran, and each
  stage answers for itself:

    {"id":"<node_id>",
     "stages":{
       "data":  {"status":"completed","rows":<int actually written to data/sft>,
                 "requested_rows":<int the recipe asked for>,
                 "fingerprint":"<content hash of train.json>"},
       "train": {"status":"completed","model_path":"<the model dir you scored>",
                 "template":"<the chat template LF ACTUALLY used, read back from train_config.yaml>",
                 "actual_epochs":<float completed>,"train_loss":<float final>},
       "eval":  {"status":"completed","score":<float native % from summary.json>,
                 "limit":<int items evaluated; -1 = the full frozen benchmark>,
                 "n_samples":<int the scorer ACTUALLY scored, from summary.json>,
                 "stderr":<float from summary.json>,"elapsed_s":<float wall clock>},
       "review":{"status":"completed","failure_classes":{"<your class name>":<count>},
                 "sampled":<true if the counts come from a SAMPLE, false for a full census>,
                 "sample_size":{"correct":<k>,"wrong":<k>},
                 "anomalies":"<repetition/length/format drift, or 'none'>",
                 "conclusion":"<one sentence: the dominant failure mode AND where it lives — model capability / output shape / scorer parsing>",
                 "dominant_evidence":"<ONE quoted comparison: what the parser wanted vs what the model emitted>"}}}

  Every stage also accepts, and SHOULD carry when true:
    - `"error"`: only with status "failed" — say WHICH gate or tool refused, and why.
    - `"fixes"`: the mechanical workarounds THIS stage needed. Put them on the stage that needed
      them, never in one run-level list: a train-stage `max_steps` added to fit the budget and a
      data-format cast mean completely different things, and a flat list is how a 0.40-epoch node
      was once read as a completed epochs comparison.
    - `"script"`: `{"path":"<abs path>","sha256":"<sha256sum>"}` for a script YOU wrote for that
      stage, or omit it when the tool did all the work. Never `""` — a path with no hash is not
      identification, and the recipe's real identity is the hash.

  RULES
  - Do NOT write `status` or `score` at the top level. The score lives in exactly one place
    (`stages.eval.score`) and the node's status is DERIVED from it: a real number means completed.
  - `n_samples` is what the scorer actually scored; `limit` is what was REQUESTED. They differ
    whenever the run is AUTO-sized or gets cut short, and only `n_samples` says how big the
    measurement really was. Giving `sample_size` lets you omit `sampled` — it is derived from it.
  - The eval NUMBERS are not yours to be careful about. After you finish, the runtime reads every
    `summary.json` under this node's `eval/` and overwrites `score` / `limit` / `n_samples` /
    `stderr` / `elapsed_s` with the frozen harness's own values, adds `summary_dir` for the one
    the score came from, and — when you scored more than one checkpoint — a `checkpoint_sweep` of
    all of them. So restate them for your own reasoning, but a typo costs nothing, and there is no
    reason to omit an eval you ran: every checkpoint you scored will be visible whether or not it
    won, which is the point. It also means the score you write is CHECKED against the eval dirs:
    claiming a number none of them produced gets logged.
  - `requested_rows` vs `rows`: a selector with `strict=false` silently returns whatever the pool
    had. If they differ by more than 10%, say so in the data stage's `fixes`.
  - On a BASELINE run omit `data` and `train` entirely (a baseline has no data and no training),
    or write them as `{"status":"skipped"}`.
  - Extra fields are welcome. If you learned something the shape above has no slot for — where the
    parser lives, what target format it wants, what your pre-check found — add it. The leader sees
    everything in this file.

  WRITE INCREMENTALLY — the score must never be hostage to later steps:
    1. the moment the eval's summary.json exists, IMMEDIATELY write report.json with the data,
       train and eval stages;
    2. only then do the REVIEW stage and REWRITE report.json adding `stages.review`.
  A completed report with no `review` is acceptable (the loop salvages it if you are cut off); a
  `review` written before the score is on disk is a contract violation. If you fail BEFORE any
  score exists, still write the report with `stages.eval` at `{"status":"failed","score":null,
  "limit":0,"error":"..."}` — never exit without one.
