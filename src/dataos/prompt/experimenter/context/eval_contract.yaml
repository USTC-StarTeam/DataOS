description: >
  KB block — the eval format contract: read the scorer to learn what it parses
  (parser / format_sensitive / expected_target_shape / target_example), and the FORMAT
  PRE-CHECK before training. Audience: investigator + experimenter. No render params.
template: |
  - eval_format_contract — READ the evaluator's own code to learn what output the scorer parses.
    The bench task/scorer lives under the eval bridge named in your task prompt. Read the target
    bench's task + its scorer/parser. Record:
      - `parser`: how it parses model output (the function + file:line and the extraction steps);
      - `format_sensitive` (bool): true if the scorer extracts a STRUCTURED answer by PARSING the
        output (tool call, code block, JSON, MCQ letter, regex) — a wrong shape then scores 0 even
        when the content is right; false if it is free text graded loosely by an LLM judge;
      - `expected_target_shape`: the EXACT shape a training example's answer must take, including
        any template/tag it expects (e.g. `<tool_call>[{"name":..,"arguments":{..}}]`);
      - `target_example`: ONE concrete filled-in instance — a real input mapped to the exact target
        string the scorer would accept — so the executor has a literal target to render toward, not
        just a description.
    This is the single most important part — a format mismatch caps the score no matter how good
    the data is.
  - FORMAT PRE-CHECK (inside the sbatch script, after building data and BEFORE the training step):
    if this bench's eval extracts a structured answer by PARSING model output (tool call / code /
    JSON / MCQ letter — NOT a free-text LLM judge), take 3 of the built `output` targets and run
    them through the SAME parser the sampled eval will use. If it cannot extract a valid structure
    from your own targets, the format is misaligned — you would train the model to emit something
    the scorer cannot read, capping the score regardless of data or hyperparameters. Abort before
    training, fix the recipe's rendering step so the target matches `expected_target_shape`,
    re-check, then train. Record the pre-check outcome (passed, or what you changed) in report.json.
  - CHECKPOINT SWEEP (only when the plan set `save_steps`, and only for full-parameter runs) —
    after training, score EVERY surviving `final_model/checkpoint-<step>/` AND `final_model`
    itself, then deliver the HIGHEST SCORER as this experiment's model: `model.path` in
    report.json is that directory and `score` is its score. Which point on a training curve is
    best is not knowable in advance and is frequently not the last one.
    Use the SAME frozen eval command for every candidate, changing ONLY `--model-path` and
    `--output-dir` (one eval dir per candidate, so the runs stay separable). Never vary `--limit`
    between candidates: the eval size belongs to the run, and two candidates scored at different
    sizes are not comparable. Report the WHOLE table, not just the winner — "the midpoint beat
    the final" is a finding the next round can act on even when the winner itself is
    unremarkable, and it is lost for good if only one number comes back.
