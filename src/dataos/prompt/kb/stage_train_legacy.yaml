description: >
  TRAIN stage legacy invoke — used ONLY while no Trainer is registered in the tool
  registry (the reserved trainer slot). When dataos-train lands as a real Trainer
  implementation this template disappears. Render params: frozen_command (str, empty
  when training is ours), frozen_produces (str), cli_path (dataos-train CLI path).
template: |
  {% if frozen_command %}FROZEN recipe — you do NOT choose hyperparameters. Turn your curated data into a model with the task's fixed training: `{{ frozen_command }}` → model at {{ frozen_produces }}. Fill the {ctx.*} placeholders; that model is the EVAL stage's {ctx.model_path}.{% else %}DETERMINISTIC via dataos-train (installed in train_env). Your task prompt carries a ready TRAIN SPEC JSON — runtime-owned fields are code-injected, do NOT edit them; only `method` came from the plan. Flow: 1) write it to {ctx.run_root}/trainspec.json on the exec host; 2) on the LOGIN node: `{{ cli_path }} validate {ctx.run_root}/trainspec.json` (fail-fast, no GPU) then `{{ cli_path }} build {ctx.run_root}/trainspec.json` — build renders AND writes run_train.sh + train config into run_root; 3) submit a thin sbatch wrapper (activate op with ctx.env_path=train_env, then `bash {ctx.run_root}/run_train.sh`) via the submit op; poll to terminal; 4) `{{ cli_path }} collect --run-dir {ctx.run_root}` → result.json; merge its report_fragment into report.json. FALLBACK only if dataos-train is broken/unavailable: hand-write the LF config per the legacy recipe in your system prompt (record the fallback in report.json).{% endif %}
