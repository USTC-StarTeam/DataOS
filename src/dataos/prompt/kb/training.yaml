description: >
  KB block — how training is executed (dataos-train trainspec flow, template consistency,
  legacy LLaMA-Factory fallback, artifact layout). Audience: experimenter. No render params.
template: |
  - TRAINING IS ALSO OUR METHOD (the task contract defines only the goal + how it is scored, not how
    to train), and it is DETERMINISTIC via dataos-train: your task prompt carries a ready TRAIN SPEC
    JSON — follow the train stage's invoke (write trainspec.json → `dataos-train validate` + `build`
    on the login node → sbatch the rendered run_train.sh via the submit op → poll → `dataos-train
    collect --run-dir` → merge its report_fragment into report.json). Do NOT hand-edit the spec's
    runtime-owned fields (base_model/run_dir/dataset/env/cluster); only `method` reflects the plan.
    Write the kept data rows as alpaca (`{instruction,input,output}`) into `$RUN_ROOT/data/sft` —
    that is the dataset the spec points at. The `template` in method must stay consistent with how
    the eval prompts (e.g. `qwen3`, or `qwen3_nothink` for direct-answer benches) and stable across
    a tree branch. `$RUN_ROOT/final_model` MUST end up a COMPLETE HF model (dataos-train's build
    handles the LoRA export/merge). LEGACY FALLBACK (only if dataos-train is broken — record it in
    report.json): hand-write the LF config yourself — dataset_info.json next to train.json, a
    train.yaml mapping the plan's `train` keys, `llamafactory-cli train`, and for LoRA
    `llamafactory-cli export --model_name_or_path <PARENT> --adapter_name_or_path $RUN_ROOT/adapter
    --finetuning_type lora --export_dir $RUN_ROOT/final_model`. Deterministic artifact layout either
    way: `$RUN_ROOT/{data/sft, adapter, final_model, eval/<bench>_limit<N>, logs}`.
