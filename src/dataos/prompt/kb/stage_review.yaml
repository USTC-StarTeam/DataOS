description: >
  REVIEW stage invoke — analyze the trained model's rollouts from the eval and write
  the analysis block in report.json. Interpretation only: the score comes from the
  frozen eval and is never touched here. No render params.
template: |
  analyze the model's rollouts at {ctx.eval_dir}/predictions.jsonl — SAMPLE, don't read them all: take the correct/wrong counts from summary.json, then read only a handful (3-5) of CORRECT and WRONG raw outputs (never judge from the score alone). Classify each sampled error with a SHORT STRING class name you choose (common ones: wrong_reasoning / format_deviation / truncation / parse_failure — but name whatever you actually see), note anomalies (repetition, length, format drift), and write the `analysis` block in report.json (its shape is in the report contract kb block).

  Then go one level deeper — don't stop at WHAT the failures look like, find WHERE they live: take 1-2 cases from the DOMINANT class and trace them yourself. Read the scorer's parser code (the eval contract names it) and check whether a failed case's raw output actually contains a correct answer the parser couldn't read (protocol-side loss) or the content itself is wrong/degenerate (model-side failure). "parse_failure" as a class is never a root cause — say WHAT the parser expected and what the model actually emitted. If something looks off and a cheap probe can settle it (re-run the parser on one output, regenerate one example), do it.

  One-sentence conclusion naming the dominant failure mode AND its location (model capability / output shape / scorer parsing). This stage INTERPRETS — it never re-scores.
