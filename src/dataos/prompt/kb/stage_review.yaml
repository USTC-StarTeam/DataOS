description: >
  REVIEW stage invoke — analyze the trained model's rollouts from the eval and write
  the analysis block in report.json. Interpretation only: the score comes from the
  frozen eval and is never touched here. No render params.
template: |
  analyze the model's rollouts at {ctx.eval_dir}/predictions.jsonl — SAMPLE, don't read them all: take the correct/wrong counts from summary.json, then read only a handful (3-5) of CORRECT and WRONG raw outputs (never judge from the score alone). Classify each sampled error with a SHORT STRING class name you choose (common ones: wrong_reasoning / format_deviation / truncation / parse_failure — but name whatever you actually see), note anomalies (repetition, length, format drift), and write the `analysis` block in report.json (its shape is in the report contract kb block). One-sentence conclusion naming the model's dominant failure mode. This stage INTERPRETS — it never re-scores.
