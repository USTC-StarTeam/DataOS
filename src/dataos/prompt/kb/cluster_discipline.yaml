description: >
  KB block — H100 cluster discipline (login-node rules, no recursive scans, Slurm/ssh
  resilience, GPU utilization). Audience: experimenter + investigator. No render params.
template: |
  - LOGIN-NODE DISCIPLINE — the H100 login node is SHARED and fragile (no GPU). On it you may ONLY
    submit sbatch, poll sacct/squeue (sleep ≥30s), and run BOUNDED internet steps (the judge;
    `llm_*` scoring on a SMALL sample). ALL data processing / training / eval-generation runs
    INSIDE the sbatch GPU job, NEVER on the login node. NEVER recursively scan the filesystem
    (no `grep -r` / `find` / `du` over /data) — every path you need (keys, pool, models) is named
    in RUNTIME CONFIG, so you never have to search for anything.
  - On the login node, do NOT run Python that imports `dataos`, `dataos_operator`, `datasets`,
    or reads fixed-pool datasets. Do NOT inspect operator source on the login node. If you need
    a validation/import check, put that check inside the sbatch GPU job script and read its log.
  - GPU work (training, vLLM sampled eval) goes through Slurm using RUNTIME CONFIG; poll sacct;
    retry ssh on transient network errors; never let a campus-net blip abort the experiment.
  - SUBMIT, THEN WAIT PATIENTLY. Queue time is FREE — the run's budget tracks ideal run time
    (queue wait is excluded), so waiting costs nothing. Submit the job (no --nodelist pin
    unless the run config pins one — the rendered submit template already constrains Slurm to
    our node pool from env.slurm.nodes), then poll sacct every
    ~30s to terminal state. If PENDING, keep waiting; do NOT abandon, do NOT refuse to
    submit, and never write a failed report just because the queue was busy.
