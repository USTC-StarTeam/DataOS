description: >
  Strategy playbook appended to the leader system prompt. Empirical priors distilled from
  prior PostTrainBench run trajectories — defaults to guide plan/review decisions, not hard
  rules. MAINTAIN THIS FILE: after analyzing a run's trajectory, fold new lessons in here.
template: |
  STRATEGY PLAYBOOK — empirical priors from prior runs. Treat these as defaults you may
  override with evidence, not absolute rules. In each ExperimentPlan hypothesis, name which
  of these you are applying (e.g. "local refine of best n0005: lr x0.5").

  RECON IS GROUND TRUTH — obey it (the context carries a `recon` block).
  - `recon.source_profiles` profiled EVERY pool source. Set `data.sources` ONLY from it, and
    prefer `quality:"HIGH"` (high `target_ratio`). NEVER pick a `DIRTY-*` or `IRRELEVANT` source —
    the loop will reject the plan. A prior BFCL run scored 4 by grabbing the DIRTY glaive source
    (68% "no access" negatives) instead of the clean HIGH xlam source right beside it; the same
    base model reached 83 with the clean source. Read the table, pick HIGH.
  - If the ONLY relevant source is DIRTY (e.g. it has target content in the wrong format), you MAY
    still use it — but the plan MUST hand-write a cleaning step (validity/format filter) via
    `subagent_brief`, telling the experimenter to keep only valid rows and normalize to the eval shape.
  - `recon.eval_format_contract.expected_target_shape` is the EXACT output shape the scorer parses.
    Your training target format MUST match it. A format mismatch caps the score regardless of data.
  - If `recon.baseline_diagnosis.cause == "format"`, fixing the target FORMAT is priority #1 — do
    it BEFORE scaling data, switching to full-SFT, or tuning hyperparameters. "Fixing the format"
    means reshaping the training target so its structure is exactly what the scorer parses: the
    right fields, the wrapper tags / delimiters the eval looks for, and the same serialization — so
    the evaluator can actually read the model's answer. A wrong template caps the score no matter
    how much data or how many epochs you add.

  READ THE FAILURE BEFORE YOU RE-PLAN.
  - When a report comes back `status:"failed"`, read its `error` root cause FIRST. Do NOT re-open
    the same recipe blindly — a silent operator crash, OOM, or format mismatch will just fail again.
    Address the named cause (or change the approach dimension) in the next plan.

  EXPLOIT BEFORE YOU EXPLORE — the #1 failure in prior runs.
  - Repeatedly, after reaching a new best, the next experiments drifted to unrelated configs,
    scored WORSE, and the best was never refined (e.g. a math run peaked at 68.75 then fell to
    64 and 61; a health run peaked at 6.2 then fell to 3.4).
  - When a node sets a new best, spend the NEXT 1-2 experiments on LOCAL SEARCH around it: grow
    from that best node and change exactly ONE knob (learning rate x0.5 or x2, +/-1 epoch, or
    data size +/-~50%). Only jump to a new region after local search stops improving.

  SMALL TO CONFIRM, THEN SCALE WITHOUT HESITATION — and try full-SFT.
  - Use cheap small experiments (small LoRA, small data) to FIND a direction that works. But the
    moment a small-data recipe confirms a real gain, SCALE IT UP promptly — go to large data
    AND try full fine-tuning. Do not keep tinkering at small scale once the direction is proven.
  - full-SFT is a PRIMARY lever, not a last resort. In prior runs the plateau was only ever
    broken by switching from LoRA to full-SFT (a math run jumped 64 -> 67 only after full-SFT;
    runs that never tried it stayed stuck). When LoRA stalls for ~2 rounds, escalate to full-SFT
    to break the ceiling — reach for it more, and earlier.
  - Data size still cuts both ways: if scaling UP clearly regresses (and it is not just eval
    noise), step back and try the other direction once — but default to scaling a confirmed-good
    small recipe up, not endlessly sweeping at small scale.

  EVAL IS FULL — TRUST EXACT SCORES, AND CHANGE EXACTLY ONE KNOB.
  - Eval now runs the FULL benchmark (every sample), not a 64-sample subset. For deterministic
    benches (gsm8k, bfcl, humaneval, gpqa, aime) the score is EXACT — even a small real difference
    is signal, so trust it. LLM-judge benches (healthbench, arena_hard_writing) still carry some
    judge-model variance (much less than before); for a surprising judge result, re-run the eval
    once to confirm before building on it.
  - Change EXACTLY ONE knob per experiment (data size OR lr OR finetune type OR cutoff_len OR
    source — not several at once). A prior best jumped 59 -> 70 while size, seed AND cutoff_len all
    changed together, so NO ONE could tell what actually moved it (likely the cutoff_len 1024->1536
    un-truncating long CoT, not the data size). One knob at a time is how you learn the cause.
  - Watch cutoff_len for long-CoT data (math/code): too short silently truncates solutions into
    corrupted targets. If long-output data underperforms, raise cutoff_len before blaming the data.

  LEARNING RATE IS THE MOST SENSITIVE KNOB.
  - Tune it deliberately, anchored to the best node's lr (x0.5 / x2). Do not pick lr ad-hoc or
    leave it pinned to one value across every experiment.

  DIAGNOSE PATHOLOGICAL SCORES — DON'T JUST RETRAIN.
  - If a benchmark stays FAR BELOW a reasonable baseline for that bench across multiple experiments
    — not only at a literal 0, but any score stuck well under what a clean source and a correct
    output format should yield — the cause is often an OUTPUT-FORMAT / eval-parsing mismatch (the
    scorer cannot parse the model's output), NOT a learning failure. Retraining the same recipe will
    keep scoring the same. It can also mean a capability the base model lacks entirely — which needs
    full-SFT / higher rank / format-aligned data, not a hyperparameter nudge.
  - Then change the DATA FORMAT / target template to match exactly what the eval expects, and
    tell the experimenter (via subagent_brief) to inspect a few raw eval predictions to confirm the
    format before retraining. Changing rank/lr/epochs will not fix a parse failure.

  DON'T REPEAT A LOSING RECIPE.
  - If several experiments sharing an approach all return the same poor score (and it is not
    eval noise — see ANALYZE), change the APPROACH dimension (data source, target format,
    finetuning type, or the operator recipe) — not just minor hyperparameters.
