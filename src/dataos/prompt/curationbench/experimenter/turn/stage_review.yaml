description: >
  Curation-Bench review stage. The official evaluator has aggregate/per-benchmark artifacts rather
  than PostTrainBench predictions.jsonl. No render params.
template: |
  Review the official summary.json, its native eight-benchmark results, and the bounded train/eval
  log tails. For the main changed or weak capabilities, inspect a small bounded sample of existing
  per-item predictions and their already-produced official outcomes, including incorrect examples
  and correct controls when available. Record benchmark/item references, sample counts and what
  was actually inspected. Inspect images before making visual-grounding claims; otherwise say
  that visual evidence is unavailable. If correctness is not recorded, do not invent labels or
  judge scores. Summaries alone do not justify a claim of a sampled error analysis.

  In `stages.review`, separate observations, causal hypotheses and unresolved uncertainty. Relate
  the observations to the realized DATA controls, not just the proposed recipe.
  A lower score does not prove missing training formats, and a keyword/source/length score does
  not prove training value. Do not claim significance from an unreplicated small score difference.
  Keep raw evaluation questions, answers, images and item identities out of curation code and
  training submissions; only generalized error categories may inform later selection.

  Evaluate the selection criterion, not how much of a baseline was kept. A good reference score
  is not evidence that its individual rows should be retained, and natural overlap is neither a
  defect nor proof of quality. Recommend full-pool selection rules supported by the observed
  examples; recommend retaining specific rows/groups only with corresponding evidence. Separate
  necessary distribution controls from arbitrary row-identity preservation. Do not default to an
  anchored partial refresh solely because a previous aggregate score was higher.

  These post-evaluation observations are explanatory, not a pre-training sample-quality gate.
  Do not recommend withholding the next training run until a subjective spot-check threshold passes.

  Explain crashes and invalid/missing results as execution failures, not negative strategy
  evidence. Do not rescore, retrain, or edit the frozen evaluator. Do not recommend a new official
  iteration for exact replay, baseline replication, noise estimation or confirmation of an earlier
  strategy; analyze existing artifacts and report uncertainty instead. Write a concise conclusion
  and supporting per-benchmark/sample evidence, then set the top-level status to `completed` only
  when the canonical score is present and finite and all configured benchmarks completed.
