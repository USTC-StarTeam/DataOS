description: >
  One Curation-Bench experiment. Render params mirror the common experiment turn.
template: |
  Implement Curation-Bench experiment '{{ exp_name }}' for {{ bench }}.
  Frozen root base model: {{ root_base_model }}
  Strategy-tree node: {{ node_id }} parent={{ parent_node_id }}
  Official suite: {{ suite_dir }}
  Official target: {{ suite_target }} (iteration {{ iteration }}/{{ max_iterations }},
  state={{ suite_target_state }})
  Official target run dir: {{ suite_run_dir }}
  Official submission path: {{ submission_path }}
  {{ remaining_iterations }} official iterations remain after this target.

  CURATION PLAN (preserve the intent; round 0 must remain the official random baseline):
  {{ recipe_json }}
  Leader brief: {{ subagent_brief }}

  Runtime facts:
  {{ runtime_config_json }}

  Remote scratch: {{ run_root }}
  Local report: {{ report_path }}
  Local durable state: {{ state_path }}

  Initialize report.json with status `data`, then execute the configured stages. Code has already
  created the run-scoped suite and activated this target. Use {{ suite_dir }} as
  `{ctx.suite_dir}`; never call `init` or `next`. Use the target's official
  `default_submission_path` shown above as `{ctx.submission_path}` and retain both values.
  Substitute those exact values into the frozen TRAIN/EVAL commands. Read task-collect's
  model_path unchanged as `{ctx.model_path}`. Put the canonical eval output under `{ctx.eval_dir}`
  and record that path as stages.eval.summary_dir.

  If the supplied target state is already `completed`, this is crash recovery after the official
  eval landed: do not curate, train, or evaluate again. Collect the existing official result and
  finish report.json for this same target.

  For newly planned selections, baseline/parent data is a comparison reference, not an implicit
  retained subset or excluded subset. Implement the plan against the full frozen pool with its
  stated eligibility/ranking/sampling rule. Do not introduce an unrequested retention quota or
  discard previously selected rows merely because they appeared in the reference. Report natural
  row overlap after selection, separately from distribution controls. If the plan explicitly
  retains particular rows/groups, record the supporting evidence instead of assuming that the
  reference's aggregate score establishes those rows' value.
  During recovery, preserve an already-materialized submission and reuse running/completed
  train/eval work. Do not rebuild data or repeat training just to retrofit new planning rules;
  those rules govern the next newly planned selection.

  For every post-baseline selector, perform a bounded pre-training check within this same target:
  - Inspect a small deterministic sample of highly ranked/selected candidates and same-source
    random controls. Check whether they actually exhibit the claimed capability or quality.
    Inspect images when making visual-grounding claims; if unavailable, record that limitation.
    Keywords, length, format validity and source labels are proxies, not verified usefulness.
  - Check feature prevalence, empty groups and quota capacity before committing to the selection.
    Compare realized exact-row overlap/replacement, source counts, QA-pair/turn counts and
    answer-length distribution with the intended reference and the leader's stated controls.
    Use stable pool row indices or full-row hashes, not unverified `(subset,id)` uniqueness.
    Record the actual effect of deduplication and image-group caps rather than just their names.
  - Write sample counts, reference paths, observations, unresolved assumptions and selection
    statistics into the existing `stages.data` report. Correct unintended deviations during DATA
    before submitting frozen TRAIN; do not consume another target to fix a preflight issue.

  Do not use an official iteration to confirm an earlier strategy, replicate the random baseline,
  estimate noise, or rerun the same selected rows under a different name/order/seed. Compare
  selection membership with earlier submissions in this suite; if it is unchanged, revise the
  selection before TRAIN. Recovery of unfinished work in the current target is allowed, but it
  must reuse durable handles/results and must not create an additional confirmation experiment.
  The first official random baseline stays unchanged; later confirmation-only plans are forbidden.

  If quota capacity is infeasible before materializing or officially submitting data, preserve
  the measured joint capacities, requested quotas, shortfalls and diagnostic file paths in
  stages.data. Set stages.data.failure_kind to quota_capacity, submission_materialized to false,
  official_submit_called to false, and rows to 0; identify the data job handle and record TRAIN
  and EVAL as not_started. Put capacities, requested_quotas and shortfalls in
  stages.data.capacity_diagnostic. Return a failed report without starting downstream work. Code may ask
  the leader for a bounded correction of this same target. Never change the official queue.
  If stages.data.preflight_revision is present, read its revised plan and diagnostic_path before
  proceeding: the leader's revised DATA intent supersedes the archived failed allocation.

  {{ env_ops }}

  {{ task_def }}

  {{ stage_blocks }}
