description: >
  Curation-Bench per-round planning request. Render params: context_json, catalog_json,
  catalog_pointer, catalog_path, validation_errors_json (optional).
template: |
  Choose the next single curation experiment and return one ExperimentPlan JSON object only.

  Put a fully executable selection intent in `data`, for example its filters, scores, diversity
  rule, quotas, and deterministic seed. Leave `train` as `{}` and omit eval_limit. The official
  random baseline is already code-fixed; propose the next evidence-driven strategy.

  Every post-baseline official iteration must attempt a new selection improvement. Do not spend
  an iteration on exact replay, baseline replication, seed-only repetition, noise estimation,
  or confirmation of an earlier strategy. Uncertainty is a limitation to report, not permission
  for a confirmation-only experiment. Reuse existing predictions and logs for further analysis;
  do not request another training/evaluation run merely to verify a previous result.

  In `data` or the subagent brief, state the primary intervention, the evidence supporting it,
  what should remain controlled, and the expected data change relative to the chosen reference.
  Distinguish observed errors from untested causal hypotheses. A benchmark name or an aggregate
  score change alone does not establish which training examples are useful. Require bounded
  sample checks of the proposed feature/ranking and a pre-training comparison of exact row
  overlap, source counts, QA-pair/turn counts and answer-length distribution. Choose the actual
  algorithm and intervention size yourself; do not call a change local without checking its
  realized size. A new name or reordered copies of an old subset are not a new intervention.

  Context bundle:
  {{ context_json }}
  {% if catalog_pointer %}

  Available compatible data operators: read {{ catalog_pointer }}. Use their exact names in the
  recipe when they implement the intended step; the experimenter may add a run-local operator for
  a genuinely missing operation.
  {% else %}

  Available compatible data operators (also persisted at {{ catalog_path }}):
  {{ catalog_json }}
  {% endif %}
  {% if validation_errors_json is defined and validation_errors_json %}

  Your previous plan failed code validation:
  {{ validation_errors_json }}
  Return a corrected ExperimentPlan JSON object only.
  {% endif %}
